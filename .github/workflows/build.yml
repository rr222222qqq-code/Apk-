
name: Build Dragon Tiger APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "DragonTigerScanner.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o DragonTigerScanner.zip -d project
          find project -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew -type f | head -n 1)
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/project" -name gradlew -type f | head -n 1)")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerScanner-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          
